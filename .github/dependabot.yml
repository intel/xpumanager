version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: dev
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directories:
      - "/xpumd"
      - "/xpumd/common"
      - "/xpumd/exporter/intelxpuinfo"
      - "/xpumd/exporter/intelxpuinfo/api"
      - "/xpumd/extension/inteldevicewatch"
      - "/xpumd/processor/intelxpustatus"
      - "/xpumd/receiver/intelcrashlog"
      - "/xpumd/receiver/intelxpu"
      - "/xpumd/test/integration"
      - "/xpumd/tools"
    schedule:
      interval: "weekly"
    groups:
      otel-collector:
        patterns:
          - "go.opentelemetry.io/collector/*"
      non-otel-collector:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directories:
      - "/xpumd/level-zero-go"
      - "/xpumd/level-zero-go/examples"
      - "/xpumd/level-zero-go/hack"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "github.com/xlab/c-for-go"
    groups:
      level-zero-go:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/xpumd"
    schedule:
      interval: "weekly"
    ignore:
      # Go minor version (i.e. 1.X to 1.X+1) bumped manually
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Manage manually, to match the distro version with what the driver stack packages are built for
      - dependency-name: "buildpack-deps"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
