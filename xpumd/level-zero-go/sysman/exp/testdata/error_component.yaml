#
# Error stub: component method failures (DriverGet + DeviceGet + EnumRasErrorSets
# succeed, the experimental component methods fail with
# ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS = 0x70010000).

Drivers:
  - ExtensionProperties:
      # to get specified errors for experimental RAS APIs
      - Name: "ZES_extension_ras_state"
        Version: 1

    Devices:
      - RasErrorSets:
          - ReturnValues:
              zesRasGetStateExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
              zesRasClearStateExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
