# Fallback behavior where the driver advertises an older version of the extension than implemented by the bindings.

Drivers:
  - ExtensionProperties:
      - Name: "ZES_extension_ras_state"
        Version: 65536 # ZES_RAS_STATE_EXP_VERSION_1_0
      - Name: "ZES_experimental_virtual_function_management"
        Version: 65537 # ZES_VF_MANAGEMENT_EXP_VERSION_1_1, one below VF_MANAGEMENT_EXP_VERSION_CURRENT

    Devices:
      # Configured so that a code bypassing the version check in the extension
      # gate would see these, instead of the expected UNSUPPORTED_FEATURE.
      - VirtualFunctions:
          - Capabilities:
              VfID: 1
        RasErrorSets:
          - Properties:
              Type: 0 # ZES_RAS_ERROR_TYPE_CORRECTABLE
            State:
              Category: [1, 2, 3, 4, 5, 6, 7]
          - Properties:
              Type: 1 # ZES_RAS_ERROR_TYPE_UNCORRECTABLE
            State:
              Category: [1, 2, 3, 4, 5, 6, 7]
            ReturnValues:
              zesRasGetState: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
