#
# Config file for the hack/types-mangle tool.
# Targeting the auto-generated const.go
#
options:
  prefix: "zes"
  doxygenPath: xml/zes__api_8h.xml

types:
  - name: "*"
    newComment: |-
      {{ .Name }} is declared in the Level Zero sysman API.
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}
    typeAssert: int32
    newType: uint32
  - name: "Ras*"
    newComment: |-
      {{ .Name }} declared in:
      https://oneapi-src.github.io/level-zero-spec/level-zero/latest/sysman/api/experimental/ras.html#{{ .DocAnchor }}
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}
  - name: "RasStateExpVersion"
    newComment: |-
      {{ .Name }} declared in:
      https://oneapi-src.github.io/level-zero-spec/level-zero/latest/sysman/api/experimental/data_types.html#{{ .DocAnchor }}
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}

values:
  - name: "*"
    newComment: |-
      {{- with doxygen . -}}
      {{ . }}
      {{- end -}}
