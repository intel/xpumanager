#
# Config file for the hack/types-mangle tool.
# Targeting the auto-generated types.go
#
options:
  prefix: "zes"
  doxygenPath: xml/zes__api_8h.xml

structs:
  - name: "*"
    fields:
      - name: Pad_cgo_0
        newName: _
      - name: Stype
        newName: stype
        newType: structureType
      - name: PNext
        newName: pnext
        newType: unsafe.Pointer
  - name: RasStateExp
    fields:
      - name: Category
        newType: RasErrorCategoryExp

types:
  - name: "*"
    newComment: |-
      {{ .Name }} is declared in the Level Zero sysman API.
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}
  - name: "Ras*"
    newComment: |-
      {{ .Name }} declared in:
      https://oneapi-src.github.io/level-zero-spec/level-zero/latest/sysman/api/experimental/ras.html#{{ .DocAnchor }}
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}
  - name: "*Handle"
    newComment: |-
      {{ .Name }} is a handle type used by the Level Zero sysman API.
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}
