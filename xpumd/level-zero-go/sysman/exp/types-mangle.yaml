#
# Config file for the hack/types-mangle tool.
# Targeting the auto-generated types.go
#
options:
  prefix: "zes"
  doxygenPath: xml/zes__api_8h.xml
  yamlTags: true

fieldTypes:
  - type: _Ctype_struct__ze_bool_t
    newType: core.Bool

structs:
  - name: "*"
    fields:
      - name: Pad_cgo_0
        newName: _
      - name: Stype
        newName: stype
        newType: structureType
      - name: PNext
        newName: pnext
        newType: unsafe.Pointer
  - name: RasStateExp
    fields:
      - name: Category
        newType: RasErrorCategoryExp
  - name: VfExp2Capabilities
    fields:
      - name: Address
        newType: sysman.PciAddress
  - name: VfUtilMemExp2
    fields:
      - name: VfMemLocation
        newType: sysman.MemLoc
  - name: VfUtilEngineExp2
    fields:
      - name: VfEngineType
        newType: sysman.EngineGroup

types:
  # A non-matching rule to provide a default comment to use for other rules.
  - name: "_"
    newComment: &linked |-
      {{ .Name }} declared in:
      https://oneapi-src.github.io/level-zero-spec/level-zero/latest/sysman/api/{{ .DocPage }}#{{ .DocAnchor }}
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}

  - name: "*"
    newComment: |-
      {{ .Name }} is declared in the Level Zero sysman API.
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}

  # Type-specific rules to set the correct link to the online documentation.
  - name: "Ras*"
    docPage: experimental/ras.html
    newComment: *linked
  - name: "Vf*"
    docPage: experimental/vf_management.html
    newComment: *linked

  - name: "*Handle"
    newComment: |-
      {{ .Name }} is a handle type used by the Level Zero sysman API.
      {{- with doxygen . }}

      {{ . }}
      {{- end -}}
