# Error stub: driver method failures (DriverGet and the extension function lookup succeed).

Drivers:
  - ReturnValues:
      zesIntelDriverEnumInfoLogsExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
      zesIntelDriverEventRegisterExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
      zesIntelDriverEventListenExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS

    ExtensionProperties:
      - Name: "ZES_intel_experimental_driver_info_logs"
        Version: 65536 # ZES_INTEL_DRIVER_INFO_LOGS_EXP_VERSION_1_0
      # to get the Intel experimental driver scoped event APIs enabled
      - Name: "ZES_intel_experimental_driver_event"
        Version: 65536 # ZES_INTEL_DRIVER_EVENT_EXP_VERSION_1_0

    Devices:
      - Properties: {}

    InfoLogs:
      - Properties: {}
