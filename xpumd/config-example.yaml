receivers:
  # The Intel XPU receiver.
  intel_xpu:
    # Metrics data collection interval.
    # Must be at least twice the sampling_interval.
    collection_interval: 5s
    # Initial start delay for metrics collection, any non positive value is assumed to be immediately.
    initial_delay: 1s
    # Metrics collection timeout.
    timeout: 0
    # Sampling interval for the high-frequency metrics.
    sampling_interval: 1s
    # Whether to fail collector startup if the L0 Sysman API cannot be
    # initialized (e.g. no GPU driver or device access). Defaults to false.
    fail_on_sysman_init_error: false
    # Collection of the GPU info logs, i.e. the CPER records provided by the GPU driver.
    info_logs:
      # Whether the info logs are collected. Enabling requires elevated
      # privileges (for the CPER records, access to the kernel tracing filesystem).
      enabled: false
      # Name of the collection instance that the records are collected into
      # (a tracefs instance in the case of the CPER records).
      # Required, and must not contain '/'.
      instance_name: xpumd
    # Configuration for enabling/disabling individual metrics.
    # See receiver/intelxpu/sysman/documentation.md for list of available metrics.
    metrics:
    #  hw.memory.size:
    #    enabled: false

  intel_crashlog:
    # Directory to watch for new crashlog files (must exist!).
    directory: /var/log/crashlog
    # Filename glob patterns (matched against the base name of each file).
    globs: ["*.bin", "*.crashlog"]
    # Ignore files whose modification time is older than this duration before
    # startup. Zero means only files created after startup are processed.
    ignore_older_than: 0s
    # Maximum crashlog file size in bytes, larger files are skipped.
    max_file_size: 1048576
    # Minimum crashlog file size in bytes, smaller files are skipped.
    min_file_size: 1
    # Static attributes added to every emitted log record (optional).
    # add_attributes:
    #   hw.vendor: "ACME"

processors:
  intel_xpu_status:
    rules:
      - name: "Intel GPU core temperature health warning threshold(s)"
        source_metric: "hw.temperature"
        parent_metric: "hw.gpu.info"
        parent_ref_attribute: "hw.id"
        parent_filters:
          - key: "pci.vendor_id"
            values: ["8086"]
        component_filters:
          - key: "hw.sensor_location"
            values: ["gpu"]
        copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
        add_attributes:
          hw.type: "temperature"
        # Ordered list of state rules. The rules should be ordered by increasing severity.
        # All rules are evaluated, the last matching one will be active.
        states:
          # Default state
          - state_name: "ok"
          - state_name: "warning"
            conditions:
              - value: 100
                parent_filters:
                  - key: "pci.device_id"
                    values: ["56c0", "56c2"]
              - value: 95
                parent_filters:
                  - key: "pci.device_id"
                    values: ["56c1"]
              # Default core temperature warning threshold for other device IDs
              - value: 105
          - state_name: "critical"
            conditions:
              - value: 125
                parent_filters:
                  - key: "pci.device_id"
                    values: ["56c0", "56c1", "56c2"]
              # Default core temperature critical threshold for other device IDs
              - value: 130
      - name: "Intel GPU memory temperature health critical threshold(s)"
        source_metric: "hw.temperature"
        parent_metric: "hw.gpu.info"
        parent_ref_attribute: "hw.id"
        parent_filters:
          - key: "pci.vendor_id"
            values: ["8086"]
        component_filters:
          - key: "hw.sensor_location"
            values: ["memory"]
        copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
        add_attributes:
          hw.type: "temperature"
        # Ordered list of state rules. The rules should be ordered by increasing severity.
        # All rules are evaluated, the last matching one will be active.
        states:
          # Default state
          - state_name: "ok"
          - state_name: "critical"
            conditions:
              - value: 105
                parent_filters:
                  - key: "pci.device_id"
                    values: ["56c0", "56c1", "56c2"]
              # Default memory temperature critical threshold for other device IDs
              - value: 100
      - name: "Intel GPU power usage health warning threshold(s)"
        source_metric: "hw.power"
        parent_metric: "hw.gpu.info"
        parent_ref_attribute: "hw.id"
        parent_filters:
          - key: "pci.vendor_id"
            values: ["8086"]
        aggregate:
          function: "Max"
          group_by: ["hw.sensor_location"]
        copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
        add_attributes:
          hw.type: "gpu"
        # Ordered list of state rules. The rules should be ordered by increasing severity.
        # All rules are evaluated, the last matching one will be active.
        states:
          # Default state
          - state_name: "ok"
          - state_name: "warning"
            conditions:
              - value: 600
                parent_filters:
                  - key: "pci.device_id"
                    values: ["0bd0", "0bd4", "0bd5", "0bd6", "0be5"]
              - value: 450
                parent_filters:
                  - key: "pci.device_id"
                    values: ["0bd7", "0bd8"]
              - value: 300
                parent_filters:
                  - key: "pci.device_id"
                    values: ["020a", "0bd9", "0bda", "0bdb", "0b6e"]
              - value: 190
                parent_filters:
                  - key: "pci.device_id"
                    values: ["e20b", "e210"]
              - value: 150
                parent_filters:
                  - key: "pci.device_id"
                    values: ["0205", "0203", "56c0", "56c2", "e20c"]
              - value: 75
                parent_filters:
                  - key: "pci.device_id"
                    values: ["e216"]
              - value: 38
                parent_filters:
                  - key: "pci.device_id"
                    values: ["56c1"]
              - value: 25
                parent_filters:
                  - key: "pci.device_id"
                    values: ["4907"]
              # Default power usage warning threshold for other device IDs
              - value: 300

  # An example config for filter processor: drop hw.status{hw.state="ok"} data points to reduce metric cardinality.
  # NOTE: If enabled in the default pipeline, this also affects the
  # intel_xpu_info exporter: healthy components will have no active status entry.
  filter/ok_status:
    metrics:
      datapoint:
        - 'metric.name == "hw.status" and attributes["hw.state"] == "ok"'

exporters:
  intel_xpu_info:
    # Only unix domain socket is allowed.
    # If `endpoint` is unset, `$XDG_RUNTIME_DIR/intel_xpu_info.sock` is used instead.
    #endpoint: "/run/xpumd/intel_xpu_info.sock"
    hw_status_mappings:
      - health_domain: "memory"
        filters:
          - key: hw.type
            values: [memory]
        state_mapping:
          unknown:
            severity: unknown
          ok:
            severity: ok
          degraded:
            severity: warning
          critical:
            severity: critical
          replace:
            severity: critical
          "*":
            severity: warning
            message: "Unexpected memory health state, mapped to warning"
      # GPU device states.
      - health_domain: "gpu"
        filters:
          - key: hw.type
            values: [gpu]
        state_mapping:
          ok:
            severity: ok
          wedged:
            severity: critical
          survivability:
            severity: critical
          "*":
            severity: warning
      # Default mapping (empty filters matches any data point not matched above):
      - health_domain: "{{ .hw_type }}"
        state_mapping:
          unknown:
            severity: unknown
          ok:
            severity: ok
          warning:
            severity: warning
          critical:
            severity: critical
          failed:
            severity: failed
          "*":
            severity: warning
  prometheus:
    endpoint: "127.0.0.1:8080"

extensions:
  # HTTP endpoint for checking the collector status.
  health_check:
    endpoint: "127.0.0.1:13133"

  # Watches for changes in the set of GPU devices this process can use.
  #
  # The L0 Sysman API enumerates devices once, at zesInit: a device that was not
  # there then is never reported, and one that has gone stays in the inventory.
  # In a container the device files under /dev/dri can also drift from the host.
  # This extension compares sysfs against the device files and reports what it
  # finds; picking the changes up needs a restart.
  intel_device_watch:
    # How often to compare sysfs against the device files.
    scan_interval: 30s
    # Number of consecutive scans that must agree before a change is acted on.
    # PCI rescan and driver rebind produce transients.
    settle_scans: 2
    # Action to take once a change has settled: "log" or "exit". Exiting shuts
    # the collector down gracefully (with exit code 0).
    change_action: log
    # How often a persisting condition is re-logged. Changes are always logged
    # immediately; zero logs each condition only when it appears or changes.
    report_interval: 10m
    # Time window for counting collector restarts initiated by the
    # intel_device_watch extension.
    restart_window: 10m
    # Restarts allowed within the restart_window before falling back to "log" action.
    # Zero disables exiting. Counted in restarts, not exits: what it guards
    # against is the loop of exiting, getting restarted and exiting again.
    max_restarts: 3
    # State file for restart limiter. Unset disables restart limiting.
    #state_file: /run/xpumd/device-watch-restarts.json
    # sysfs device classes to watch. Supported: "drm", "mei". A subsystem whose
    # nodes are not mapped into the container reports as inaccessible forever.
    subsystems: [drm, mei]
    # PCI vendor IDs to watch, without the "0x" prefix. Empty watches all.
    vendor_ids: ["8086"]
    # sysfs mount point to read the device inventory from.
    #sysfs_root: /sys
    # Root of the device file tree compared against sysfs.
    #dev_root: /dev

service:
  extensions: [health_check, intel_device_watch]
  telemetry:
    logs:
      level: info
      disable_stacktrace: true
  pipelines:
    metrics:
      receivers: [intel_xpu]
      processors: [intel_xpu_status]
      exporters: [intel_xpu_info,prometheus]
    logs:
      # "intel_crashlog" receiver can be added when its dir is present
      receivers: [intel_xpu]
      exporters: [intel_xpu_info]
