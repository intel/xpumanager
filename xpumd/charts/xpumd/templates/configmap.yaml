apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xpumd.fullname" . }}-config
  labels:
    {{- include "xpumd.labels" . | nindent 4 }}
data:
  # Default configuration for the Intel Crashlog receiver. Can be overridden
  # in config.yaml (via .Values.config).
  config-receiver-crashlog.yaml: |-
    receivers:
      intel_crashlog:
        directory: /var/log/crashlog
        globs: ["*.bin", "*.crashlog"]
        ignore_older_than: 0s
  # Default configuration for the GPU info log collection of the Intel XPU
  # receiver. Can be overridden in config.yaml (via .Values.config).
  config-receiver-infolog.yaml: |-
    receivers:
      intel_xpu:
        info_logs:
          enabled: {{ .Values.infoLogs.enabled }}
          instance_name: xpumd
  # Default configuration for the Intel XPU status processor. Can be overridden
  # in config.yaml (via .Values.config).
  config-processor-xpustatus.yaml: |-
    processors:
      intel_xpu_status:
        rules:
          - name: "Intel GPU core temperature health warning threshold(s)"
            source_metric: "hw.temperature"
            parent_metric: "hw.gpu.info"
            parent_ref_attribute: "hw.id"
            parent_filters:
              - key: "pci.vendor_id"
                values: ["8086"]
            component_filters:
              - key: "hw.sensor_location"
                values: ["gpu"]
            copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
            add_attributes:
              hw.type: "temperature"
            # Ordered list of state rules. The rules should be ordered by increasing severity.
            # All rules are evaluated, the last matching one will be active.
            states:
              # Default state
              - state_name: "ok"
              - state_name: "warning"
                conditions:
                  - value: 100
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c0", "56c2"]
                  - value: 95
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c1"]
                  # Default core temperature warning threshold for other device IDs
                  - value: 105
              - state_name: "critical"
                conditions:
                  - value: 125
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c0", "56c1", "56c2"]
                  # Default core temperature critical threshold for other device IDs
                  - value: 130
          - name: "Intel GPU memory temperature health critical threshold(s)"
            source_metric: "hw.temperature"
            parent_metric: "hw.gpu.info"
            parent_ref_attribute: "hw.id"
            parent_filters:
              - key: "pci.vendor_id"
                values: ["8086"]
            component_filters:
              - key: "hw.sensor_location"
                values: ["memory"]
            copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
            add_attributes:
              hw.type: "temperature"
            # Ordered list of state rules. The rules should be ordered by increasing severity.
            # All rules are evaluated, the last matching one will be active.
            states:
              # Default state
              - state_name: "ok"
              - state_name: "critical"
                conditions:
                  - value: 105
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c0", "56c1", "56c2"]
                  # Default memory temperature critical threshold for other device IDs
                  - value: 100
          - name: "Intel GPU power usage health warning threshold(s)"
            source_metric: "hw.power"
            parent_metric: "hw.gpu.info"
            parent_ref_attribute: "hw.id"
            parent_filters:
              - key: "pci.vendor_id"
                values: ["8086"]
            aggregate:
              function: "Max"
              group_by: ["hw.sensor_location"]
            copy_attributes: ["hw.id", "hw.name", "pci.bdf", "hw.sensor_location", "com.intel.subdevice_id"]
            add_attributes:
              hw.type: "gpu"
            # Ordered list of state rules. The rules should be ordered by increasing severity.
            # All rules are evaluated, the last matching one will be active.
            states:
              # Default state
              - state_name: "ok"
              - state_name: "warning"
                conditions:
                  - value: 600
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["0bd0", "0bd4", "0bd5", "0bd6", "0be5"]
                  - value: 450
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["0bd7", "0bd8"]
                  - value: 300
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["020a", "0bd9", "0bda", "0bdb", "0b6e"]
                  - value: 190
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["e20b", "e210"]
                  - value: 150
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["0205", "0203", "56c0", "56c2", "e20c"]
                  - value: 75
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["e216"]
                  - value: 38
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["56c1"]
                  - value: 25
                    parent_filters:
                      - key: "pci.device_id"
                        values: ["4907"]
                  # Default power usage warning threshold for other device IDs
                  - value: 300

  # Default configuration for the Intel XPU info exporter. Can be overridden
  # in config.yaml (via .Values.config).
  config-exporter-xpuinfo.yaml: |-
    exporters:
      intel_xpu_info:
        endpoint: "/run/xpumd/intel_xpu_info.sock"
        hw_status_mappings:
          - health_domain: "memory"
            filters:
              - key: hw.type
                values: [memory]
            state_mapping:
              unknown:
                severity: unknown
              ok:
                severity: ok
              degraded:
                severity: warning
              critical:
                severity: critical
              replace:
                severity: critical
              "*":
                severity: warning
                message: "Unexpected memory health state, mapped to warning"
          # GPU device states.
          - health_domain: "gpu"
            filters:
              - key: hw.type
                values: [gpu]
            state_mapping:
              ok:
                severity: ok
              wedged:
                severity: critical
              survivability:
                severity: critical
              "*":
                severity: warning
          # Default mapping (empty filters matches any data point not matched above):
          - health_domain: {{`"{{ .hw_type }}"`}}
            state_mapping:
              unknown:
                severity: unknown
              ok:
                severity: ok
              warning:
                severity: warning
              critical:
                severity: critical
              failed:
                severity: failed
              "*":
                severity: warning
  config.yaml: |-
{{ .Values.config | toYaml | indent 4 }}
