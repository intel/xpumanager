# Attribute filter with an invalid operator in parent_filters (deep nesting)
#
# expect-error: invalid filter operator "Exists" for key "pci.device_id"

processors:
  intel_xpu_status:
    rules:
      - name: "invalid condition parent filter"
        source_metric: "hw.temperature"
        parent_metric: "hw.gpu.info"
        states:
          - state_name: "warning"
            conditions:
              - value: 95.0
                parent_filters:
                  - key: "pci.device_id"
                    operator: "Exists"
                    values: ["56c0"]
