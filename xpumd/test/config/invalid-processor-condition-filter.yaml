# Attribute filter with an empty value in parent_filters (deep nesting)
#
# expect-error: filter value cannot be empty for key "pci.device_id"

processors:
  intel_xpu_status:
    rules:
      - name: "invalid condition parent filter"
        source_metric: "hw.temperature"
        states:
          - state_name: "warning"
            conditions:
              - value: 95.0
                parent_filters:
                  - key: "pci.device_id"
                    values: [""]
