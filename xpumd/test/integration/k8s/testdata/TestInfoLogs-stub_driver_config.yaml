Drivers:
  - ExtensionProperties:
      - Name: "ZES_extension_info_logs"
        Version: 65536  # ZES_INFO_LOGS_EXT_VERSION_1_0
      # The Intel experimental extensions are advertised as well, the stable
      # one above is preferred over them
      - Name: "ZES_intel_experimental_driver_info_logs"
        Version: 131072  # ZES_INTEL_DRIVER_INFO_LOGS_EXP_VERSION_2_0
      - Name: "ZES_intel_experimental_driver_event"
        Version: 65536

    # CPER data is pending from the start, i.e. the records are read as soon as
    # the collection instance has been created.
    Events: 65536  # ZES_EVENT_TYPE_FLAG_INFO_LOG_CPER_DATA_AVAILABLE_EXT

    Devices:
      - Properties:
          Core:
            Type: 1       # ZE_DEVICE_TYPE_GPU
            VendorId: 0x1234
            DeviceId: 0x0bd5
            Uuid:
              Id: "12345678-0000-0000-0000-000000000000"
          ModelName: "Super 3000"
          VendorName: "ACME Inc."
          SerialNumber: "SN-0001"

        PCI:
          Properties:
            Address:
              Domain: 0
              Bus: 5
              Device: 0
              Function: 0

    InfoLogs:
      - Properties:
          InfoLogType: 0  # ZES_INFO_LOG_TYPE_EXT_DEVICE
          InfoLogFormat: 0  # ZES_INFO_LOG_FORMAT_EXT_CPER
          IsNamedInstanceSupported: true
          IsPeekDataSupported: false
        BufferSizeInKb: 4096  # reported as the effective size for the collection instance
        Collection:
          Status:
            # Reported by every call, i.e. by the query call of a read as well:
            # the counter of the receiver keeps growing by twice this
            DroppedRecordCount: 3
            HasDataToRead: false
          Records:
            # A record of the device above, i.e. attributed to it
            - Data: "CPER-RECORD-DEVICE"
              Address:
                Domain: 0
                Bus: 5
                Device: 0
                Function: 0
              Uuid:
                Id: "12345678-000a-00b0-0c00-00000000d000"
              Timestamp: 1234567  # nanoseconds, driver specific reference point
              RecordType: 2  # ZES_INFO_LOG_RECORD_TYPE_EXT_ERROR_CORRECTED
            # A record of a device that Sysman does not report
            - Data: "CPER-RECORD-UNKNOWN"
              Address:
                Domain: 0
                Bus: 6
                Device: 0
                Function: 0
              Uuid:
                Id: "12345678-000a-00b0-0c00-00000000d001"
              Timestamp: 7654321
              RecordType: 4  # ZES_INFO_LOG_RECORD_TYPE_EXT_ERROR_FATAL
        ReturnValues:
          # The dropped record count is only reported with this warning
          zesInfoLogInstanceReadWithMetadataExt: 0x70020001  # ZE_RESULT_WARNING_DROPPED_DATA

    # Not collected, as the stable info logs above are preferred
    IntelInfoLogs:
      - Properties:
          InfoLogType: 0  # ZES_INTEL_INFO_LOG_TYPE_EXP_DEVICE
          InfoLogFormat: 0  # ZES_INTEL_INFO_LOG_FORMAT_CPER
          IsNamedInstancedCollectionSupported: true
          IsPeekSupported: false
        Collection:
          Records:
            - Data: "CPER-RECORD-INTEL-EXP"
              Address:
                Domain: 0
                Bus: 5
                Device: 0
                Function: 0
