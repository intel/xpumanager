# SPDX-License-Identifier: MIT

Drivers:
  - ExtensionProperties:
      - Name: "ZES_extension_power_limits"
        Version: 65536
      - Name: "ZES_extension_ras_state"
        Version: 65536
    Devices:
      - Properties:
          Core:
            Type: 1       # ZE_DEVICE_TYPE_GPU
            VendorId: 0x8086
            DeviceId: 0x0bd5
            Uuid:
              Id: "12345678-0000-0000-0000-000000000000"
          NumSubdevices: 2
          ModelName: "Super 3000"
          VendorName: "ACME Inc."
          SerialNumber: "SN-0001"
          Flags: 1  # ZES_DEVICE_PROPERTY_FLAG_INTEGRATED

        PCI:
          Properties:
            Address:
              Domain: 0
              Bus: 5
              Device: 0
              Function: 0
            MaxSpeed:
              Gen: 4
              Width: 16
              MaxBandwidth: 32000000000
            HaveBandwidthCounters: true
          Stats:
            RxCounter: 3000000
            TxCounter: 6000000
            # 1 s later than the initial config: 6 MB of rx+tx over 1 s
            Timestamp: 2000000

        Firmwares:
          - Properties:
              OnSubdevice: false
              SubdeviceId: 0
              CanControl: true
              Name: "GFX"
              Version: "1.2.3.4"

        ECC:
          Available: true
          Configurable: true
          State:
            CurrentState: 1  # ZES_DEVICE_ECC_STATE_ENABLED
            PendingState: 1
            PendingAction: 0

        EngineGroups:
          - Properties:
              Type: 1  # ZES_ENGINE_GROUP_COMPUTE_ALL
              OnSubdevice: false
              SubdeviceId: 0
            Activity:
              ActiveTime: 750000
              # 1 s later than the initial config: 250 ms active -> 0.25 ratio
              Timestamp: 2000000
          - Properties:
              Type: 3  # ZES_ENGINE_GROUP_COPY_ALL
              OnSubdevice: false
              SubdeviceId: 0
            Activity:
              ActiveTime: 300000
              Timestamp: 2000000

        FrequencyDomains:
          - Properties:
              Type: 0  # ZES_FREQ_DOMAIN_GPU
              OnSubdevice: false
              SubdeviceId: 0
              CanControl: true
              Min: 300
              Max: 1600
            Range:
              Min: 200
              Max: 1200
            State:
              Request: 1000
              Tdp: 1600
              Efficient: 300
              Actual: 800
              ThrottleReasons: 1  # ZES_FREQ_THROTTLE_REASON_FLAG_AVE_PWR_CAP

        MemoryModules:
          - Properties:
              Type: 0  # ZES_MEM_TYPE_HBM
              OnSubdevice: false
              SubdeviceId: 0
              Location: 1  # ZES_MEM_LOC_DEVICE
              PhysicalSize: 17179869184
            State:
              Health: 2  # ZES_MEM_HEALTH_DEGRADED
              Free: 4294967296
              Size: 17179869184
            Bandwidth:
              ReadCounter: 2147483648
              WriteCounter: 1073741824
              MaxBandwidth: 512000000000
              # 1 s later than the initial config: 1.5 GiB over 1 s
              Timestamp: 2000000

          # Second module without size information: exercises the
          # hw.memory.free fallback used when neither the physical nor the
          # allocatable size is known.
          - Properties:
              Type: 1  # ZES_MEM_TYPE_DDR
              OnSubdevice: false
              SubdeviceId: 0
              Location: 0  # ZES_MEM_LOC_SYSTEM
              PhysicalSize: 0
            State:
              Health: 1  # ZES_MEM_HEALTH_OK
              Free: 1073741824
              Size: 0

        PowerDomains:
          - Properties:
              OnSubdevice: false
              SubdeviceId: 0
              CanControl: true
              IsEnergyThresholdSupported: true
              ExtendedProperties:
                Domain: 2  # ZES_POWER_DOMAIN_PACKAGE
                DefaultLimit:
                  Enabled: true
                  Limit: 150000
            EnergyCounter:
              Energy: 55000000
              # 1 s later than the initial config: 50 J over 1 s -> 50 W
              Timestamp: 2000000
            LimitsExt:
              - Level: 1  # ZES_POWER_LEVEL_SUSTAINED
                Source: 0  # ZES_POWER_SOURCE_ANY
                LimitUnit: 2  # ZES_LIMIT_UNIT_POWER
                EnabledStateLocked: false
                Enabled: true
                IntervalValueLocked: false
                Interval: 1000
                LimitValueLocked: false
                Limit: 200000

        RasErrorSets:
          - Properties:
              Type: 0  # ZES_RAS_ERROR_TYPE_CORRECTABLE
              OnSubdevice: false
              SubdeviceId: 0
            StateExp:
              - Category: 7  # ZES_RAS_ERROR_CATEGORY_EXP_MEMORY_ERRORS
                ErrorCounter: 12
          - Properties:
              Type: 1  # ZES_RAS_ERROR_TYPE_UNCORRECTABLE
              OnSubdevice: false
              SubdeviceId: 0
            StateExp:
              - Category: 0  # ZES_RAS_ERROR_CATEGORY_EXP_RESET
                ErrorCounter: 1
              - Category: 3  # ZES_RAS_ERROR_CATEGORY_EXP_COMPUTE_ERRORS
                ErrorCounter: 0

        TemperatureSensors:
          - Properties:
              Type: 0  # ZES_TEMP_SENSORS_GLOBAL
              OnSubdevice: false
              SubdeviceId: 0
              MaxTemperature: 110.0
              IsThreshold1Supported: true
              IsThreshold2Supported: true
            Temperature: 75.0
          - Properties:
              Type: 1  # ZES_TEMP_SENSORS_GPU
              OnSubdevice: false
              SubdeviceId: 0
              MaxTemperature: 110.0
              IsThreshold1Supported: true
              IsThreshold2Supported: true
            Temperature: 110.0  # above 105 °C default threshold → warning
          - Properties:
              Type: 2  # ZES_TEMP_SENSORS_MEMORY
              OnSubdevice: false
              SubdeviceId: 0
              MaxTemperature: 100.0
              IsThreshold1Supported: true
              IsThreshold2Supported: true
            Temperature: 90.0  # above 85 °C threshold → warning
